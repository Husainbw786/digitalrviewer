name: dr_ui_preview
description: "Browser preview of the DigitalRViewer desktop screens with sample data."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: AlbertSans
      fonts:
        - asset: fonts/AlbertSans-400.ttf
        - asset: fonts/AlbertSans-500.ttf
          weight: 500
        - asset: fonts/AlbertSans-600.ttf
          weight: 600
        - asset: fonts/AlbertSans-700.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: fonts/SourceSerif4-400.ttf
        - asset: fonts/SourceSerif4-500.ttf
          weight: 500
